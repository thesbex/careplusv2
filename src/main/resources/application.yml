spring:
  application:
    name: careplus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Casablanca
        generate_statistics: false
        format_sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    placeholder-replacement: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never
  forward-headers-strategy: framework
  # Compression HTTP des réponses servies par Tomcat embarqué — couvre le bundle
  # SPA (JS ~2.4 Mo → ~645 Ko gz, CSS ~220 Ko → ~68 Ko) ET le worker pdf.js
  # (~1 Mo → ~300 Ko) chargé au 1er affichage d'un PDF. Principal levier sur le
  # « chargement lent » côté cabinet on-premise (aucun Nginx devant — ADR-020).
  compression:
    enabled: true
    mime-types: "text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml,application/wasm,application/manifest+json"
    min-response-size: 1024

careplus:
  documents:
    # Racine filesystem où sont stockés les binaires (QA2-2). En prod on-premise
    # cible un dossier dédié sur le SSD du cabinet, inclus dans le backup.
    root: ${CAREPLUS_DOCUMENTS_ROOT:./data/documents}
  deployment-mode: ${CAREPLUS_DEPLOYMENT_MODE:ON_PREMISE}
  enabled: ${CAREPLUS_ENABLED:true}
  time:
    zone: Africa/Casablanca
  security:
    jwt:
      secret: ${CAREPLUS_JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me}
      issuer: careplus
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
    login:
      rate-limit-attempts: 5
      rate-limit-window-minutes: 15
    cors:
      # Comma-separated list of allowed origins. Empty = same-origin only
      # (production deployment serves the SPA from this same Spring Boot process).
      allowed-origins: ${CAREPLUS_CORS_ALLOWED_ORIGINS:}
  modules:
    pregnancy:
      enabled: false
    amo:
      enabled: false
    backup:
      enabled: false
  # Assistant IA (module ma.careplus.assistant) — provider configurable.
  # Défaut : Gemini (free tier Google) via son endpoint OpenAI-compatible.
  # Pour basculer vers GPT : provider=openai, base-url=https://api.openai.com/v1,
  #   model=gpt-4o-mini, api-key=${OPENAI_API_KEY}.
  # Pour Groq (gratuit) : provider=groq, base-url=https://api.groq.com/openai/v1,
  #   model=llama-3.3-70b-versatile, api-key=${GROQ_API_KEY}.
  # Pour Ollama (local, on-premise, aucune donnée ne sort) : provider=ollama,
  #   base-url=http://localhost:11434/v1, model=llama3.1 (pas de clé).
  ai:
    enabled: ${CAREPLUS_AI_ENABLED:true}
    provider: ${CAREPLUS_AI_PROVIDER:gemini}
    base-url: ${CAREPLUS_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    # gemini-2.5-flash : modèle gratuit/rapide courant (les 1.x sont retirés pour
    # les nouvelles clés). `gemini-flash-latest` = alias auto-suiveur si souhaité.
    model: ${CAREPLUS_AI_MODEL:gemini-2.5-flash}
    api-key: ${GEMINI_API_KEY:}
    temperature: 0.3
    max-tokens: 1024
    timeout-seconds: 60

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    ma.careplus: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
